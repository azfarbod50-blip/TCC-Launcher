appId: 'tcc-launcher'
productName: 'TCC Launcher'
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2026 TCC'

asar: true
compression: 'store'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

win:
  icon: 'build/icon.ico'
  target:
    - target: 'nsis'
      arch: 'x64'

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  unicode: false

directories:
  buildResources: 'build'
  output: 'dist'
