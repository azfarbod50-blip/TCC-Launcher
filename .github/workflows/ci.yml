name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .sqlx
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential

      - name: Prepare SQLx query cache
        run: |
          DATABASE_URL="sqlite:$GITHUB_WORKSPACE/test.db"
          cargo install sqlx-cli --no-default-features --features sqlite,rustls
          cargo sqlx prepare --workspace

      - name: Check formatting (non-blocking)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Run clippy (non-blocking)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

  build-macos:
    name: Build (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .sqlx
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (macOS)
        continue-on-error: true
        run: |
          brew install gtk+3 librsvg pkg-config || true

      - name: Prepare SQLx query cache
        run: |
          DATABASE_URL="sqlite:$GITHUB_WORKSPACE/test.db"
          cargo install sqlx-cli --no-default-features --features sqlite,rustls
          cargo sqlx prepare --workspace

      - name: Check formatting (non-blocking)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Run clippy (non-blocking)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

  build-windows:
    name: Build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .sqlx
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Prepare SQLx query cache
        run: |
          $env:DATABASE_URL = "sqlite:$env:GITHUB_WORKSPACE/test.db"
          cargo install sqlx-cli --no-default-features --features sqlite,rustls
          cargo sqlx prepare --workspace

      - name: Check formatting (non-blocking)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Run clippy (non-blocking)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

      - name: Package installer (Windows)
        run: |
          cargo install cargo-packager --locked
          cargo packager --release -p tcc_app --formats nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: tcc-launcher-installer
          path: target/release/bundle/nsis/*.exe
          retention-days: 7

  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: tcc-launcher-installer
          path: ./installer

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./installer/*.exe
          generate_release_notes: true